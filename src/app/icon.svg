<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".5" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF1493"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <!-- disco de vinil (o "O" do logo) -->
  <circle cx="32" cy="32" r="22" fill="#111" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="5" fill="#FF2414"/>
  <!-- braço da agulha -->
  <line x1="31" y1="33" x2="45" y2="16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="31" cy="33" r="3.2" fill="#FFFFFF"/>
</svg>
